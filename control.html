<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Spending List</title>


    <!-- ============================================================
         SHEETJS
         Used to create Excel files
         ============================================================ -->

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>


    <!-- ============================================================
         JSPDF
         Used to create PDF files
         ============================================================ -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


    <!-- ============================================================
         AUTOTABLE
         Used to create tables inside PDF
         ============================================================ -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>


    <style>

        body {

            font-family: Arial, sans-serif;

            max-width: 1100px;

            margin: 50px auto;

            padding: 20px;

            background-color: #f5f5f5;

        }


        h1 {

            margin-bottom: 25px;

        }

        .filters {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;

            flex-wrap: wrap;

            align-items: center;

        }


        .name-filter {

            padding: 10px;

            width: 250px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 14px;

        }

        .month-filter {

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 5px;

            background-color: white;

            font-size: 14px;

        }

        .category-filter {

            position: relative;

        }


        .category-button {

            padding: 10px 15px;

            border: 1px solid #ccc;

            border-radius: 5px;

            background-color: white;

            cursor: pointer;

            font-size: 14px;

        }


        .category-button:hover {

            background-color: #eeeeee;

        }


        .category-menu {

            display: none;

            position: absolute;

            top: 45px;

            left: 0;

            width: 230px;

            max-height: 300px;

            overflow-y: auto;

            background-color: white;

            border: 1px solid #ccc;

            border-radius: 5px;

            padding: 10px;

            z-index: 1000;

            box-shadow: 0 3px 10px rgba(0,0,0,0.15);

        }


        .category-title {

            font-weight: bold;

            padding-bottom: 8px;

            border-bottom: 1px solid #ddd;

            margin-bottom: 8px;

        }


        .category-option {

            display: block;

            padding: 8px;

            cursor: pointer;

            border-radius: 4px;

        }


        .category-option:hover {

            background-color: #f1f1f1;

        }


        .category-option input {

            margin-right: 8px;

        }

        .clear-button {

            padding: 10px 15px;

            border: none;

            border-radius: 5px;

            background-color: #555;

            color: white;

            cursor: pointer;

            font-size: 14px;

        }


        .clear-button:hover {

            background-color: #333;

        }

        .export-buttons {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;

        }


        .export-button {

            padding: 10px 15px;

            border: none;

            border-radius: 5px;

            color: white;

            cursor: pointer;

            font-size: 14px;

        }


        .export-button:hover {

            opacity: 0.85;

        }


        .excel-button {

            background-color: #217346;

        }


        .pdf-button {

            background-color: #d32f2f;

        }

        .total-box {

            background-color: white;

            padding: 15px;

            margin-bottom: 20px;

            border-radius: 5px;

            border: 1px solid #ddd;

            font-size: 18px;

            font-weight: bold;

        }

        table {

            width: 100%;

            border-collapse: collapse;

            background-color: white;

        }


        th,
        td {

            padding: 14px;

            border-bottom: 1px solid #ddd;

            text-align: left;

        }


        th {

            background-color: #333;

            color: white;

        }


        tr:hover {

            background-color: #f1f1f1;

        }

        #message {

            margin-top: 20px;

            color: #555;

        }

        .no-data {

            text-align: center;

            padding: 20px;

            color: #777;

        }

    </style>

</head>


<body>


    <h1>Spending List</h1>


    <div class="filters">


        <!-- NAME -->

        <input
            type="text"
            id="nameFilter"
            class="name-filter"
            placeholder="Filter by name..."
            oninput="filterSpending()"
        >


        <!-- CATEGORY -->

        <div class="category-filter">


            <button
                type="button"
                class="category-button"
                onclick="toggleCategoryMenu()"
            >

                Category ▼

            </button>


            <div
                id="categoryMenu"
                class="category-menu"
            >

                <div class="category-title">

                    Select Categories

                </div>


                <div id="categoryOptions">

                    <!-- Checkboxes created here -->

                </div>

            </div>

        </div>


        <!-- MONTH -->

        <input
            type="month"
            id="monthFilter"
            class="month-filter"
            onchange="filterSpending()"
        >


        <!-- CLEAR -->

        <button
            type="button"
            class="clear-button"
            onclick="clearFilters()"
        >

            Clear Filters

        </button>

    </div>


    <div class="export-buttons">


        <button
            type="button"
            class="export-button excel-button"
            onclick="exportExcel()"
        >

            Download Excel

        </button>


        <button
            type="button"
            class="export-button pdf-button"
            onclick="exportPDF()"
        >

            Download PDF

        </button>


    </div>


    <div class="total-box">

        Total Spending:

        $<span id="totalAmount">0.00</span>

    </div>


    <table id="spendingTable">

        <thead>

            <tr>

                <th>Name</th>

                <th>Category</th>

                <th>Amount</th>

                <th>Date</th>

                <th>Notes</th>

            </tr>

        </thead>


        <tbody id="spendingList">

        </tbody>

    </table>


    <div id="message">

        Loading spending...

    </div>


    <script>


        let spending = [];

        let filteredSpending = [];

        async function loadSpending() {


            const message =
                document.getElementById("message");


            try {


                const response =
                    await fetch("control.php");


                if (!response.ok) {

                    throw new Error(
                        "HTTP error: " + response.status
                    );

                }


                const data =
                    await response.json();


                if (!data.success) {

                    message.textContent =
                        data.message;

                    return;

                }


                spending = data.data;


                filteredSpending = spending;


                createCategoryFilter();


                displaySpending(
                    spending
                );


                message.textContent = "";


            }

            catch (error) {

                console.error(error);


                message.textContent =
                    "Something went wrong while loading the spending data.";

            }

        }


        function createCategoryFilter() {


            const categoryOptions =
                document.getElementById(
                    "categoryOptions"
                );


            categoryOptions.innerHTML = "";


            const categories =
                spending.map(function(item) {

                    return String(
                        item.category ?? ""
                    );

                });


            const uniqueCategories =
                [...new Set(categories)];


            const validCategories =
                uniqueCategories.filter(function(category) {

                    return category !== "";

                });


            validCategories.sort();


            validCategories.forEach(
                function(category) {


                    const label =
                        document.createElement(
                            "label"
                        );


                    label.className =
                        "category-option";


                    const checkbox =
                        document.createElement(
                            "input"
                        );


                    checkbox.type =
                        "checkbox";


                    checkbox.value =
                        category;


                    checkbox.addEventListener(
                        "change",
                        filterSpending
                    );


                    label.appendChild(
                        checkbox
                    );


                    label.appendChild(
                        document.createTextNode(
                            " " + category
                        )
                    );


                    categoryOptions.appendChild(
                        label
                    );

                }
            );

        }


        function toggleCategoryMenu() {


            const menu =
                document.getElementById(
                    "categoryMenu"
                );


            if (
                menu.style.display === "block"
            ) {

                menu.style.display =
                    "none";

            }

            else {

                menu.style.display =
                    "block";

            }

        }


        document.addEventListener(
            "click",
            function(event) {


                const categoryFilter =
                    document.querySelector(
                        ".category-filter"
                    );


                const menu =
                    document.getElementById(
                        "categoryMenu"
                    );


                if (
                    !categoryFilter.contains(
                        event.target
                    )
                ) {

                    menu.style.display =
                        "none";

                }

            }
        );

        function getSelectedCategories() {


            const checkboxes =
                document.querySelectorAll(
                    '#categoryOptions input[type="checkbox"]:checked'
                );


            return Array.from(
                checkboxes
            ).map(function(checkbox) {

                return checkbox.value
                    .toLowerCase();

            });

        }


        function filterSpending() {


            const nameSearch =
                document.getElementById(
                    "nameFilter"
                )
                .value
                .toLowerCase()
                .trim();


            const selectedCategories =
                getSelectedCategories();


            const selectedMonth =
                document.getElementById(
                    "monthFilter"
                ).value;


            filteredSpending =
                spending.filter(
                    function(item) {


                        const name =
                            String(
                                item.name ?? ""
                            ).toLowerCase();


                        const category =
                            String(
                                item.category ?? ""
                            ).toLowerCase();


                        const date =
                            String(
                                item.date ?? ""
                            );


                        // NAME

                        const matchesName =
                            name.includes(
                                nameSearch
                            );


                        // CATEGORY

                        let matchesCategory =
                            true;


                        if (
                            selectedCategories.length > 0
                        ) {

                            matchesCategory =
                                selectedCategories.includes(
                                    category
                                );

                        }


                        // MONTH

                        let matchesMonth =
                            true;


                        if (
                            selectedMonth !== ""
                        ) {

                            matchesMonth =
                                date.startsWith(
                                    selectedMonth
                                );

                        }


                        return (

                            matchesName

                            &&

                            matchesCategory

                            &&

                            matchesMonth

                        );

                    }
                );


            displaySpending(
                filteredSpending
            );

        }


        function displaySpending(
            spendingData
        ) {


            const spendingList =
                document.getElementById(
                    "spendingList"
                );


            spendingList.innerHTML = "";


            let total = 0;


            if (
                spendingData.length === 0
            ) {


                spendingList.innerHTML = `

                    <tr>

                        <td
                            colspan="5"
                            class="no-data"
                        >

                            No spending records found.

                        </td>

                    </tr>

                `;


                document.getElementById(
                    "totalAmount"
                ).textContent =
                    "0.00";


                return;

            }


            spendingData.forEach(
                function(item) {


                    const amount =
                        parseFloat(
                            item.amount
                        ) || 0;


                    total += amount;


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${escapeHTML(item.name)}
                        </td>

                        <td>
                            ${escapeHTML(item.category)}
                        </td>

                        <td>
                            $${amount.toFixed(2)}
                        </td>

                        <td>
                            ${escapeHTML(item.date)}
                        </td>

                        <td>
                            ${escapeHTML(item.notes)}
                        </td>

                    `;


                    spendingList.appendChild(
                        row
                    );

                }
            );


            document.getElementById(
                "totalAmount"
            ).textContent =
                total.toFixed(2);

        }


        function clearFilters() {


            document.getElementById(
                "nameFilter"
            ).value = "";


            document.getElementById(
                "monthFilter"
            ).value = "";


            const checkboxes =
                document.querySelectorAll(
                    '#categoryOptions input[type="checkbox"]'
                );


            checkboxes.forEach(
                function(checkbox) {

                    checkbox.checked =
                        false;

                }
            );


            filteredSpending =
                spending;


            displaySpending(
                spending
            );

        }

        function escapeHTML(value) {


            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function exportExcel() {


            // Make sure there is data

            if (
                filteredSpending.length === 0
            ) {

                alert(
                    "There is no data to export."
                );

                return;

            }


            // Create Excel data

            const excelData =
                filteredSpending.map(
                    function(item) {

                        return {

                            "Name":
                                item.name ?? "",

                            "Category":
                                item.category ?? "",

                            "Amount":
                                parseFloat(
                                    item.amount
                                ) || 0,

                            "Date":
                                item.date ?? "",

                            "Notes":
                                item.notes ?? ""

                        };

                    }
                );


            // Create worksheet

            const worksheet =
                XLSX.utils.json_to_sheet(
                    excelData
                );


            // Set column widths

            worksheet["!cols"] = [

                { wch: 25 },

                { wch: 20 },

                { wch: 15 },

                { wch: 15 },

                { wch: 40 }

            ];


            // Create workbook

            const workbook =
                XLSX.utils.book_new();


            // Add worksheet

            XLSX.utils.book_append_sheet(
                workbook,
                worksheet,
                "Spending"
            );


            // Generate filename

            const today =
                new Date()
                    .toISOString()
                    .split("T")[0];


            const filename =
                "spending_report_" +
                today +
                ".xlsx";


            // DOWNLOAD

            XLSX.writeFile(
                workbook,
                filename
            );

        }

// Export 
        function exportPDF() {


            // Make sure there is data

            if (
                filteredSpending.length === 0
            ) {

                alert(
                    "There is no data to export."
                );

                return;

            }


            // Get jsPDF

            const {
                jsPDF
            } = window.jspdf;


            // Landscape PDF

            const doc =
                new jsPDF({
                    orientation: "landscape",
                    unit: "mm",
                    format: "a4"
                });


            doc.setFontSize(18);

            doc.text(
                "Spending Report",
                14,
                15
            );


            let filterText =
                "Filters: ";


            const name =
                document.getElementById(
                    "nameFilter"
                ).value.trim();


            const month =
                document.getElementById(
                    "monthFilter"
                ).value;


            const categories =
                getSelectedCategories();


            let filterParts = [];


            if (name !== "") {

                filterParts.push(
                    "Name: " + name
                );

            }


            if (
                categories.length > 0
            ) {

                filterParts.push(
                    "Category: " +
                    categories.join(", ")
                );

            }


            if (month !== "") {

                filterParts.push(
                    "Month: " + month
                );

            }


            if (
                filterParts.length === 0
            ) {

                filterText +=
                    "All";

            }

            else {

                filterText +=
                    filterParts.join(" | ");

            }


            doc.setFontSize(9);

            doc.text(
                filterText,
                14,
                22
            );


            let total = 0;


            filteredSpending.forEach(
                function(item) {

                    total +=
                        parseFloat(
                            item.amount
                        ) || 0;

                }
            );


            doc.setFontSize(11);

            doc.text(
                "Total Spending: $" +
                total.toFixed(2),
                14,
                30
            );

            const tableData =
                filteredSpending.map(
                    function(item) {

                        return [

                            item.name ?? "",

                            item.category ?? "",

                            "$" +
                            (
                                parseFloat(
                                    item.amount
                                ) || 0
                            ).toFixed(2),

                            item.date ?? "",

                            item.notes ?? ""

                        ];

                    }
                );


            doc.autoTable({

                startY: 36,

                head: [[

                    "Name",

                    "Category",

                    "Amount",

                    "Date",

                    "Notes"

                ]],

                body: tableData,

                theme: "grid",

                styles: {

                    fontSize: 8,

                    cellPadding: 3

                },

                headStyles: {

                    fontSize: 8

                },

                columnStyles: {

                    0: {
                        cellWidth: 40
                    },

                    1: {
                        cellWidth: 35
                    },

                    2: {
                        cellWidth: 30
                    },

                    3: {
                        cellWidth: 30
                    },

                    4: {
                        cellWidth: 120
                    }

                }

            });

            const today =
                new Date()
                    .toISOString()
                    .split("T")[0];


            const filename =
                "spending_report_" +
                today +
                ".pdf";

            doc.save(
                filename
            );

        }

        loadSpending();


    </script>


</body>

</html>
